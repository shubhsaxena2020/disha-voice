name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Run core tests
        run: ./scripts/gradle-with-retry.sh :core:test
      - name: Run app unit tests
        run: ./scripts/gradle-with-retry.sh :android:app:testDebugUnitTest
      - name: Build the debug APK
        run: ./scripts/gradle-with-retry.sh :android:app:assembleDebug
      - name: Upload the debug APK
        # Uploaded before the verification steps, and unconditionally, so that a
        # failed verification can be diagnosed from the artifact itself rather
        # than only from the log.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Verify the APK requests only the camera
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT" dump permissions "$APK" | tee /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then
            echo "::error::APK must not request the INTERNET permission"
            exit 1
          fi
          grep -q 'android.permission.CAMERA' /tmp/perms.txt
          echo "APK requests CAMERA and not INTERNET."
      - name: Verify the APK carries its third-party notices
        run: |
          set -euo pipefail
          # The app redistributes Apache-2.0 components, so the licence and the
          # attribution notices must travel with the artifact. This check makes
          # that a build failure rather than a documentation promise.
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              required = {
                  "assets/THIRD_PARTY_NOTICES.txt": "third-party notices",
                  "assets/LICENSE-Apache-2.0.txt": "Apache-2.0 licence text",
              }
              missing = [f"{n} ({why})" for n, why in required.items() if n not in names]
              if missing:
                  raise SystemExit("APK is missing required licence files: " + ", ".join(missing))
              notices = z.read("assets/THIRD_PARTY_NOTICES.txt").decode("utf-8")
              licence = z.read("assets/LICENSE-Apache-2.0.txt").decode("utf-8")
              if "Apache License" not in licence or "Version 2.0" not in licence:
                  raise SystemExit("the bundled licence text is not the Apache-2.0 licence")
              # LiteRT's own LICENSE carries a separate BSD-3-Clause attribution
              # for code derived from Caffe. It must be reproduced in full.
              if "Caffe" not in notices:
                  raise SystemExit("the notices omit the LiteRT/Caffe BSD-3-Clause attribution")
              if "UNDETERMINED" not in notices:
                  raise SystemExit("the notices must record components whose licence could not be determined")
              print(f"APK carries the third-party notices and the Apache-2.0 licence text "
                    f"({len(notices)} + {len(licence)} characters).")
          PY
      - name: Verify the shipped notices match the dependency inventory
        run: |
          set -euo pipefail
          # RESEARCH/third-party-inventory.csv is the authority for what ships.
          # The notices inside the APK are generated from it, so they cannot
          # silently drift away from it. This check fails if any component
          # marked as shipped in the inventory is missing from the notices.
          python3 - <<'PY'
          import csv, io, pathlib, re, zipfile
          apk = 'android/app/build/outputs/apk/debug/app-debug.apk'
          with open('RESEARCH/third-party-inventory.csv', encoding='utf-8', newline='') as fh:
              rows = list(csv.DictReader(fh))
          shipped = [r for r in rows if r['shipped_in_apk'] == 'yes']
          with zipfile.ZipFile(apk) as z:
              notices = z.read('assets/THIRD_PARTY_NOTICES.txt').decode('utf-8')
          def coordinate(component):
              m = re.match(r'^([\w.]+):([\w.-]+)(?::([\w.-]+))?$', component)
              if m:
                  return f"{m.group(1)}:{m.group(2)}" + (f":{m.group(3)}" if m.group(3) else '')
              return component
          missing = []
          for r in shipped:
              coord = coordinate(r['component'])
              if coord not in notices:
                  missing.append(coord)
          if missing:
              raise SystemExit(
                  f"{len(missing)} shipped components are missing from the bundled notices, "
                  f"e.g. {missing[:5]}. Regenerate the notices from the inventory."
              )
          print(f"All {len(shipped)} shipped components appear in the bundled notices.")
          PY
      - name: Record the APK SHA-256
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk-sha256.txt"
          echo "SHA-256: $(cut -d' ' -f1 "$RUNNER_TEMP/apk-sha256.txt")" >> "$GITHUB_STEP_SUMMARY"
      - name: Summarise the test results
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, re, os
          total = failed = errors = skipped = 0
          suites = []
          for path in glob.glob('**/test-results/**/*.xml', recursive=True):
              if 'testReleaseUnitTest' in path:
                  continue
              head = open(path, encoding='utf-8', errors='replace').read(4000)
              m = re.search(r'<testsuite[^>]*>', head)
              if not m:
                  continue
              tag = m.group(0)
              def count(name):
                  mm = re.search(rf'\b{name}="(\d+)"', tag)
                  return int(mm.group(1)) if mm else 0
              t, f, e, s = count('tests'), count('failures'), count('errors'), count('skipped')
              if t:
                  total += t; failed += f; errors += e; skipped += s
                  suites.append((os.path.basename(path), t, f, e, s))
          print('### Unit test results\n')
          print('| Suite | Tests | Failures | Errors | Skipped |')
          print('|---|---|---|---|---|')
          for name, t, f, e, s in sorted(suites):
              print(f'| {name} | {t} | {f} | {e} | {s} |')
          print(f'\n**Total: {total} tests, {failed} failures, {errors} errors, {skipped} skipped**')
          if failed or errors:
              raise SystemExit('unit tests failed')
          PY
      - name: Verify the APK payload matches the published release
        run: |
          set -euo pipefail
          # The published pre-release is the reference build. A debug APK is
          # not byte-identical across machines, because Gradle generates a
          # per-machine debug keystore, so the certificate in the APK Signing
          # Block always differs. What must match is the payload: code,
          # resources, manifest and the bundled model.
          curl -fsSL -o /tmp/published.apk \
            "https://github.com/shubhsaxena2020/disha-voice/releases/download/v0.1.3-prototype/disha-voice-v0.1.3-prototype-debug.apk"
          python3 scripts/compare-apk-payload.py \
            android/app/build/outputs/apk/debug/app-debug.apk /tmp/published.apk
      - name: Upload the unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: |
            core/build/test-results/**/*.xml
            android/app/build/test-results/**/*.xml
            core/build/reports/tests/**
            android/app/build/reports/tests/**
          retention-days: 14
          if-no-files-found: ignore

  website-checks:
    name: Static website checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check required pages and local-only assets
        shell: bash
        run: |
          test -s website/index.html
          test -s website/styles.css
          python3 - <<'PY'
          from pathlib import Path
          html = Path('website/index.html').read_text(encoding='utf-8')
          css = Path('website/styles.css').read_text(encoding='utf-8')
          assert '<html lang="en">' in html
          assert 'id="main"' in html and 'class="skip-link"' in html
          assert 'Illustration only · not a live detection' in html
          assert 'Not a mobility aid' in html
          assert 'prefers-reduced-motion:reduce' in css

          # The site must not LOAD anything from another origin. Outbound <a href>
          # links are fine - a link is navigation a user chooses, not a request
          # the page makes. What must not exist is a subresource or a script
          # that phones home.
          import re as _re
          # Any element that can pull a remote resource. finditer + group(0) is
          # required here: findall with a capture group returns only the group.
          for match in _re.finditer(
              r'<(?:script|img|iframe|source|video|audio|embed|object|link)\b[^>]*>', html, _re.I
          ):
              tag = match.group(0)
              if _re.search(r'(?:src|href|data)\s*=\s*["\']\s*(?:https?:)?//', tag, _re.I):
                  raise SystemExit(f'Website must not load remote subresources: {tag}')
          assert '<script' not in html.lower(), 'Website must not include JavaScript'
          assert 'fonts.googleapis.com' not in html and 'fonts.googleapis.com' not in css
          assert '@import' not in css, 'Website must not import remote stylesheets'
          assert '//fonts.' not in css and 'cdn.' not in css
          print('Website content and local-only checks passed: no JavaScript, '
                'no remote subresources, no remote fonts.')
          PY
      - name: Check internal links
        run: python3 scripts/check-website-links.py
      - name: Validate the benchmark record schema
        run: |
          set -euo pipefail
          # The schema is the machine-readable contract for future benchmark
          # runs, and RESEARCH/benchmark-plan.md points at it. If it stops
          # being a valid JSON Schema, that reference becomes a lie, so the
          # build should fail rather than carry on.
          #
          # The install is retried: a transient PyPI mirror failure has taken
          # down green builds before, and it says nothing about this project.
          for attempt in 1 2 3; do
            if python3 -m pip install --quiet jsonschema; then break; fi
            echo "pip install jsonschema failed (attempt $attempt); retrying"
            sleep 10
          done
          python3 -c "import jsonschema" || { echo "::error::could not install jsonschema"; exit 1; }
          python3 - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          with open('benchmarks/benchmark-schema.json', encoding='utf-8') as fh:
              schema = json.load(fh)
          Draft202012Validator.check_schema(schema)
          print('benchmarks/benchmark-schema.json is a valid JSON Schema (draft 2020-12).')
          PY
      - name: Audit WCAG AA text contrast
        run: python3 scripts/check-website-contrast.py
      - name: Set up a browser for the layout check
        run: |
          set -euo pipefail
          # GitHub's ubuntu runners already ship Google Chrome and the shared
          # libraries Chromium needs, so the layout check uses the system
          # browser. `playwright install --with-deps` is deliberately NOT
          # used: it runs `apt-get update` against every configured mirror,
          # including packages.microsoft.com, and fails the whole job when
          # any one of them is unreachable. That is a network dependency
          # unrelated to what is being checked.
          python3 -m pip install --upgrade pip
          pip install playwright
          python3 -c "import playwright; print('playwright module installed')"
      - name: Check the rendered layout at three viewports
        run: python3 scripts/check-website-layout.py

